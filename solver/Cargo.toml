[package]
name = "bt-solver"
version = "0.1.0"
edition = "2021"
description = "Optimal solver and difficulty analysis for Ball Twister"
publish = false

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
