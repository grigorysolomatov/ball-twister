<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1,
  user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4ece0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Ball Twister</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
<main id="app" class="screen">
  <button id="menu" type="button" class="menu" aria-label="Menu">
    <span></span><span></span><span></span></button>
  <section id="start" class="page start">
    <h1>Ball Twister</h1>
    <p class="sub">A daily puzzle</p>
    <div class="bigbtns">
      <button id="go-daily" type="button" class="primary">Daily</button>
      <button id="go-levels" type="button">Levels</button>
      <button id="go-custom" type="button">Customize</button>
    </div>
  </section>
  <section id="levels" class="page" hidden>
    <h1>Levels</h1>
    <div id="levellist" class="levellist"></div>
  </section>
  <section id="play" class="page" hidden>
    <header>
      <h1>Ball Twister</h1>
      <p id="label" class="sub"></p>
    </header>
    <p id="hint" class="hint"></p>
    <div id="board" class="board">
      <div id="rings" class="layer"></div>
      <div id="balls" class="layer"></div>
      <div id="peek" class="layer peek"></div>
      <div id="hits" class="layer hits"></div>
    </div>
    <div class="btns">
      <button id="undo" type="button">Undo</button>
      <button id="solution" type="button"
        aria-label="Hold to see the solved board">Solution</button>
    </div>
  </section>
</main>
<div id="sheet" class="sheet" hidden>
  <div class="card" id="card"></div>
</div>
<script type="module" src="src/ui/app.js"></script>
</body>
</html>
